<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../img/logo.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Clientes — Panel de administrador Verde Oliva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="adm-shell">
  <div class="adm-sidebar-backdrop" id="admSidebarBackdrop"></div>
  <aside class="adm-sidebar" id="admSidebar">
    <div class="adm-sidebar-brand">
      <span class="logo-m">Verde Oliva</span>
      <span class="logo-s">panel admin</span>
    </div>
    <nav class="adm-nav" id="adm-nav" aria-label="Secciones del panel"></nav>
    <div class="adm-sidebar-footer">
      <span id="adm-username"></span>
      <button type="button" id="adm-logout">Cerrar sesión</button>
    </div>
  </aside>

  <div class="adm-content">
    <header class="adm-topbar">
      <button class="adm-menu-toggle" type="button" id="admMenuToggle" aria-label="Abrir menú" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="adm-topbar-title">Clientes</span>
    </header>
    <main class="adm-main">
      <div class="wrap">
        <h1 class="adm-h1">Clientes</h1>
        <p class="adm-sub">Cuentas registradas con Google login.</p>
        <div id="alert"></div>
        <div id="customerList">
          <div class="adm-table-wrap">
            <table class="adm-table">
              <thead>
                <tr><th>Nombre</th><th>Email</th><th>Registrado</th><th>Pedidos</th><th>Total gastado</th><th>Acciones</th></tr>
              </thead>
              <tbody id="rows"><tr><td colspan="6" class="adm-empty">Cargando…</td></tr></tbody>
            </table>
          </div>
          <div class="adm-cards" id="cards"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="adm-modal-overlay" id="modalOverlay">
  <div class="adm-modal">
    <h2 id="d-name"></h2>
    <p class="muted" id="d-email" style="margin-top:-.8rem"></p>
    <div class="adm-table-wrap" style="margin:1rem 0">
      <table class="adm-table">
        <thead><tr><th>#</th><th>Fecha</th><th>Total</th><th>Estado</th></tr></thead>
        <tbody id="d-orders"></tbody>
      </table>
    </div>
    <div class="adm-modal-actions">
      <button class="btn btn-ghost btn-sm" type="button" id="btnClose">Cerrar</button>
    </div>
  </div>
</div>

<script src="js/admin-common.js"></script>
<script src="js/admin-clientes.js"></script>
</body>
</html>
