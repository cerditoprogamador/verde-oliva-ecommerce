<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../img/logo.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de administrador — Verde Oliva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="adm-login-wrap">
  <div class="vo-login-card">
    <img class="vo-login-logo" src="../img/logo.png" alt="" width="40" height="40">
    <div class="vo-login-heading">
      <h1>Bienvenido de nuevo</h1>
      <p>Panel de administrador de Verde Oliva</p>
    </div>
    <div id="alert" style="width:100%"></div>
    <form id="loginForm" class="vo-login-form" novalidate>
      <label for="username">Usuario
        <input type="text" id="username" name="username" autocomplete="username" required>
      </label>
      <label for="password">Contraseña
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-block" type="submit">Entrar</button>
    </form>
    <div class="vo-login-sep" id="googleSsoSep" hidden><span>O</span></div>
    <div class="vo-auth-btnwrap" id="g_id_signin" style="min-height:0"></div>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/admin-common.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
